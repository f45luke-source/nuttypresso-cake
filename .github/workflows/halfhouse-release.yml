name: Validate HALF HOUSE sales site
on:
  push:
    branches: [halfhouse-november-20261014]
    paths: ['tools/halfhouse-release.py','tools/halfhouse-verify.py','tools/hh-release-*.b64','.github/workflows/halfhouse-release.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply checksum verified HALF HOUSE patch
        run: python tools/halfhouse-release.py
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright requests beautifulsoup4
          python -m playwright install --with-deps chromium
      - name: Validate JavaScript and browser journeys
        run: |
          node --check halfhouse/home.js
          node --check halfhouse/journey.js
          node --check halfhouse/app.js
          python -m http.server 8765 --bind 127.0.0.1 >server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          python tools/halfhouse-verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halfhouse-release-validation
          path: qa
          if-no-files-found: warn
      - name: Save validated HALF HOUSE directory on working branch only
        run: |
          git config user.name 'HALF HOUSE site'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add halfhouse
          if ! git diff --cached --quiet; then
            git commit -m 'Complete HALF HOUSE real-photo November sales journey'
            git push origin HEAD:halfhouse-november-20261014
          fi
