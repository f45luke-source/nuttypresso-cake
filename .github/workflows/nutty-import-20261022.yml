name: Verify Nutty Presso public website
on:
  push:
    branches: [nutty-mobile-photos-20261022]
    paths: [.github/workflows/nutty-import-20261022.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check live HTML, scripts and every product image
        run: |
          python - <<'PY'
          import urllib.request, hashlib, time, json
          base='https://f45luke-source.github.io/nuttypresso-cake/'
          expected={
            'reservation.js':'d628819882cc336aaba6607d119770ee82fe440330423090398b4d042bb51059',
            'nutty-mobile.css':'e1bd8f4067ea07958b59b8320184d2d05d89aba3297b919335b7b021e612d6af',
            'assets/deep-basque-box-20261022.webp':'857e8ad36be544a4263ef940981a2392135a6b59823596a0859f053b5870075d',
            'assets/matcha-basque-box-20261022.webp':'21661d3d725332778f6ec66120cbb882dd04f541e6b5099bff00ed30b33fdfd5',
            'assets/strawberry-basque-box-20261022.webp':'6182310aa7291bd96a9fc14dae1af9c7a9997ee2d7bd6dc236236b3613eda893'
          }
          for attempt in range(18):
              try:
                  query='?verify=d741215-'+str(attempt)
                  html=urllib.request.urlopen(base+query,timeout=20).read().decode()
                  assert 'nutty-mobile.css?v=20261022-1' in html
                  assert 'assets/deep-basque-box-20261022.webp' in html
                  assert 'reservation-form-layout-20261021' in html
                  for path,digest in expected.items():
                      content=urllib.request.urlopen(base+path+query,timeout=20).read()
                      assert hashlib.sha256(content).hexdigest()==digest,path
                  print('LIVE_HTTP_VERIFIED',json.dumps(list(expected),ensure_ascii=False))
                  break
              except Exception as e:
                  if attempt==17: raise
                  print('Deployment propagation check',attempt+1,type(e).__name__)
                  time.sleep(5)
          PY
      - name: Install browser test client
        run: python -m pip install --quiet playwright
      - name: Test the live page at phone, tablet and desktop widths
        run: |
          mkdir -p qa
          python - <<'PY'
          import json,pathlib,shutil
          from playwright.sync_api import sync_playwright
          executable=shutil.which('google-chrome') or shutil.which('chromium')
          assert executable,'No Chromium executable on runner'
          records=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(executable_path=executable,headless=True,args=['--no-sandbox'])
              for width in [320,390,768,1440]:
                  page=browser.new_page(viewport={'width':width,'height':900},device_scale_factor=1)
                  errors=[];posts=[]
                  page.on('pageerror',lambda err:errors.append(str(err)))
                  page.on('request',lambda req:posts.append(req.url) if req.method=='POST' else None)
                  page.route('**/*.supabase.co/**',lambda route:route.abort())
                  page.goto('https://f45luke-source.github.io/nuttypresso-cake/?v=20261022-1',wait_until='networkidle')
                  page.evaluate('document.querySelectorAll("img").forEach(i=>i.loading="eager")')
                  page.wait_for_function('Array.from(document.images).filter(i=>!i.hidden && i.src).every(i=>i.complete && i.naturalWidth>0)')
                  assert page.evaluate('document.documentElement.scrollWidth')<=width
                  assert page.locator('#cake-image-placeholder').is_hidden()
                  if width<=720: assert page.locator('.quick a').first.evaluate('(e)=>parseFloat(getComputedStyle(e).paddingLeft)')>=20
                  for flavor,price in [('matcha','40,500원'),('strawberry','45,000원'),('deep_basque','37,800원')]:
                      page.locator('.slice-choice[data-preview="'+flavor+'"]').click()
                      assert page.locator('#product').input_value()==flavor
                      assert page.locator('#total').inner_text()==price
                      page.wait_for_function('document.querySelector("#cake-main-image").complete && document.querySelector("#cake-main-image").naturalWidth>0')
                      assert ('deep' if flavor=='deep_basque' else flavor)+'-basque-box' in page.locator('#cake-main-image').get_attribute('src')
                  page.locator('.cake-row[data-preview="strawberry"] h3').click()
                  assert page.locator('#product').input_value()=='strawberry'
                  assert page.locator('#date').get_attribute('min')=='2026-11-01'
                  page.locator('#product').select_option('matcha')
                  page.locator('#qty').fill('2')
                  assert page.locator('#total').inner_text()=='81,000원'
                  page.locator('#qty').fill('1')
                  page.locator('#product').select_option('deep_basque')
                  overflow=page.evaluate('''() => [...document.querySelectorAll('#form .field input,#form select,#form textarea')].filter(e=>{const a=e.getBoundingClientRect(),b=e.parentElement.getBoundingClientRect();return a.right>b.right+.5||a.left<b.left-.5}).map(e=>e.id)''')
                  assert not overflow,overflow
                  assert not errors,errors
                  assert not posts,posts
                  if width in [390,1440]:
                      page.add_style_tag(content='.mobile-cta{visibility:hidden!important}')
                      page.locator('.quick').screenshot(path='qa/menu-'+str(width)+'.png')
                      page.locator('#cakes').screenshot(path='qa/cakes-'+str(width)+'.png')
                      page.locator('#form').screenshot(path='qa/form-'+str(width)+'.png')
                  records.append({'width':width,'overflow':False,'photos':'pass','selection':'pass','totals':'pass','season':'pass','bookingPosts':len(posts)})
                  page.close()
              browser.close()
          pathlib.Path('qa/results.json').write_text(json.dumps(records,ensure_ascii=False,indent=2))
          print('LIVE_BROWSER_VERIFIED',json.dumps(records,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nutty-live-qa-20261022
          path: qa/
          retention-days: 3
