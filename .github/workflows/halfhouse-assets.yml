name: Prepare HALF HOUSE photography
on:
  push:
    branches: [halfhouse-november-20261014]
    paths: ['tools/halfhouse-assets.py', '.github/workflows/halfhouse-assets.yml']
permissions:
  contents: write
jobs:
  photography:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow requests
      - run: python tools/halfhouse-assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: halfhouse-photography
          path: |
            halfhouse/assets/photos
            halfhouse-photo-contact.jpg
            halfhouse-photo-results.json
      - name: Store optimized photographs on the working branch
        run: |
          git config user.name 'HALF HOUSE site'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add halfhouse/assets/photos
          if ! git diff --cached --quiet; then
            git commit -m 'Add optimized authorized HALF HOUSE photographs'
            git push origin HEAD:halfhouse-november-20261014
          fi
