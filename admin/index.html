<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>예약 관리 · NUTTY PRESSO</title>
<style>
:root{--ink:#35291f;--paper:#f6f3ec;--green:#254d3b;--line:#e2ddd2}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;border-radius:10px;padding:12px 16px;color:var(--ink)}button:disabled{opacity:.5;cursor:wait}button.primary{background:var(--green);color:white;border-color:var(--green)}input,select,textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink)}label{display:block;font-size:14px;margin:14px 0 6px}a{color:var(--green)}header{padding:24px 5%;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}header b{letter-spacing:2px;font-size:18px}header small{display:block;letter-spacing:0;margin-top:6px;color:#777}main{max-width:1120px;margin:auto;padding:32px 24px 80px}h1{font-size:32px;margin:8px 0}h2{font-size:21px;margin:0 0 16px}.muted{color:#766f65;font-size:14px;line-height:1.7}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:26px}.login{max-width:440px;margin:45px auto}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.spread{justify-content:space-between}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:28px 0}.stat{text-align:left;padding:22px;background:#fff;border-radius:16px}.stat strong{font-size:34px;display:block;margin-top:10px}.stat.active{background:var(--green);color:white;border-color:var(--green)}.toolbar{display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:10px;margin:18px 0}.notice{padding:14px 18px;border-radius:10px;background:#ebe5d8;line-height:1.6;margin:16px 0;white-space:pre-line}.error{background:#fce8e2;color:#8e3025}.list{display:grid;gap:12px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:22px}.badge{border-radius:30px;padding:5px 11px;background:#f7e8c3;font-size:13px}.badge.confirmed{background:#e0eee5}.badge.completed{background:#e9e8e4}.badge.cancelled{background:#f7e0df}.date{font-size:14px;color:#6a645b}.name{font-size:20px;font-weight:700;margin:14px 0 8px}.details{border-top:1px solid var(--line);margin-top:18px;padding-top:8px}.details p{white-space:pre-wrap;overflow-wrap:anywhere}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.check{display:flex;align-items:center;gap:8px;margin:20px 0}.check input{width:20px;height:20px}.empty{text-align:center;padding:60px 15px;color:#777}.summary{margin-bottom:22px;line-height:1.8}.login button{margin-top:16px}.full{width:100%}[hidden]{display:none!important}summary{cursor:pointer;margin-top:14px;font-size:14px;color:var(--green)}footer{margin-top:30px;font-size:13px;color:#888}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #b89344;outline-offset:3px}@media(max-width:640px){header{padding:20px}header b{font-size:15px}main{padding:24px 16px 60px}h1{font-size:27px}.stats{gap:7px}.stat{padding:16px 10px;font-size:13px}.stat strong{font-size:28px}.toolbar{grid-template-columns:1fr 1fr}.toolbar input[type=search]{grid-column:1/-1}.card{padding:18px}.panel{padding:22px}.login{margin:16px auto}}
</style>
<header><div><b>NUTTY PRESSO</b><small>STAFF · 예약 관리</small></div><button id="logout" hidden>로그아웃</button></header>
<main><section id="auth" class="panel login"><span class="muted">매일의 예약을 한눈에</span><h1>직원 로그인</h1><p class="muted">승인된 직원만 고객 예약을 확인할 수 있어요.</p><form id="loginForm"><label for="email">이메일</label><input id="email" type="email" autocomplete="username" required><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" minlength="8" required><button class="primary full" id="loginBtn">로그인</button><button type="button" class="full" id="signup">처음 방문 · 직원 계정 신청</button></form><p class="muted">계정 신청 → 이메일 인증 → 대표님 승인 후 이용할 수 있습니다. 인증 후 이 페이지로 돌아와 로그인해주세요.</p></section>
<div id="message" role="status" aria-live="polite" hidden></div>
<section id="dashboard" hidden><div class="row spread"><div><div class="muted" id="todayLabel"></div><h1>오늘의 예약 업무</h1></div><button id="refresh">↻ 새로고침</button></div><p class="muted">오전에는 신규 예약 연락 · 마감 전에는 내일 제작 수량 확인</p>
<div class="stats"><button class="stat active" data-filter="new">연락할 신규 예약<strong id="newCount">—</strong></button><button class="stat" data-filter="today">오늘 픽업<strong id="todayCount">—</strong></button><button class="stat" data-filter="tomorrow">내일 픽업<strong id="tomorrowCount">—</strong></button></div>
<div class="panel summary"><b>내일 준비할 케이크</b><div id="prep" class="muted">불러오는 중…</div></div>
<div class="toolbar"><input id="search" type="search" aria-label="예약 검색" placeholder="이름 또는 전화번호 검색"><select id="filter" aria-label="예약 분류"><option value="new">신규 · 연락 필요</option><option value="today">오늘 픽업</option><option value="tomorrow">내일 픽업</option><option value="upcoming">예정된 픽업</option><option value="all">전체 예약</option><option value="completed">픽업 완료</option><option value="cancelled">취소</option></select><input id="day" type="date" aria-label="픽업 날짜"><button id="reset">필터 초기화</button></div><div class="row spread muted"><span id="resultCount"></span><span id="synced"></span></div><div id="list" class="list" style="margin-top:14px"></div><button id="more" class="full" style="margin-top:16px" hidden>이전 예약 더 불러오기</button><footer>한국 시간 기준 · 변경사항은 저장 즉시 예약 데이터에 반영됩니다.</footer></section></main>
<script>
'use strict';
const BASE='https://hpexprhlyikznqaptqww.supabase.co',KEY='sb_publishable_fJzGi38yo76T3kGgjBuvUg_BVb0RwGD';
const $=s=>document.querySelector(s), names={deep_basque:'딥 바스크 치즈케이크',matcha:'말차 바스크 치즈케이크',strawberry:'딸기 바스크 치즈케이크'},statuses={new:'접수',confirmed:'확정',completed:'픽업 완료',cancelled:'취소'};
let session=null,rows=[],busy=false,limit=500,version=0;
const won=n=>Number(n).toLocaleString('ko-KR')+'원',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dateKST(offset=0){return new Date(Date.now()+9*3600000+offset*86400000).toISOString().slice(0,10)}
function message(text,error=false){$('#message').textContent=text;$('#message').className='notice'+(error?' error':'');$('#message').hidden=!text}
function saveSession(s){session=s;sessionStorage.setItem('nutty_staff_session',JSON.stringify(s))}
async function request(path,options={},token){const res=await fetch(BASE+path,{...options,headers:{apikey:KEY,'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...options.headers},cache:'no-store',signal:AbortSignal.timeout(20000)});const body=await res.text();let data;try{data=body?JSON.parse(body):null}catch{throw Error('서버 응답을 확인하지 못했습니다. 다시 시도해주세요.')}if(!res.ok)throw Error(res.status===401?'로그인이 만료되었거나 로그인 정보가 올바르지 않습니다.':res.status===429?'요청이 많습니다. 잠시 후 다시 시도해주세요.':data?.msg||data?.message||data?.error_description||'요청에 실패했습니다.');return data}
async function token(){if(!session)throw Error('로그인이 필요합니다.');if((session.expires_at||0)*1000<Date.now()+60000){const s=await request('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:session.refresh_token})});saveSession({...s,expires_at:Math.floor(Date.now()/1000)+s.expires_in})}return session.access_token}
async function api(path,opts={}){return request('/rest/v1/'+path,opts,await token())}
function clear(){version++;session=null;rows=[];sessionStorage.removeItem('nutty_staff_session');$('#dashboard').hidden=true;$('#auth').hidden=false;$('#logout').hidden=true;$('#list').replaceChildren();$('#password').value=''}
async function openDashboard(){const staff=await api('cake_staff?select=display_name&limit=1');$('#logout').hidden=false;if(!staff.length){$('#auth').hidden=true;message('계정 인증은 완료되었습니다. 아직 직원 승인이 필요합니다. 대표님에게 가입한 이메일을 전달해주세요.');return}$('#auth').hidden=true;$('#dashboard').hidden=false;await refresh()}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginBtn').disabled=true;message('로그인 중…');try{const s=await request('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('#email').value.trim(),password:$('#password').value})});saveSession({...s,expires_at:Math.floor(Date.now()/1000)+s.expires_in});$('#password').value='';await openDashboard()}catch(e){message(e.message,true)}finally{$('#loginBtn').disabled=false}};
$('#signup').onclick=async()=>{if(!$('#loginForm').reportValidity())return;$('#signup').disabled=true;try{await request('/auth/v1/signup',{method:'POST',body:JSON.stringify({email:$('#email').value.trim(),password:$('#password').value})});message('계정 신청을 접수했습니다. 이메일 인증 후 이 페이지에서 로그인해주세요. 기존 계정이면 로그인해주세요. 예약 조회는 대표님 승인 후 가능합니다.')}catch(e){message(e.message,true)}finally{$('#signup').disabled=false}};
$('#logout').onclick=async()=>{const t=session?.access_token;clear();message('로그아웃했습니다.');if(t)try{await request('/auth/v1/logout',{method:'POST'},t)}catch{}};
async function refresh(){if(busy)return;busy=true;$('#refresh').disabled=true;const current=version;message('예약을 불러오는 중…');try{const active=await api('cake_reservations?select=*&status=in.(new,confirmed)&order=pickup_date.asc,pickup_time.asc&limit=1000');const recent=await api('cake_reservations?select=*&order=created_at.desc&limit='+limit);if(current!==version)return;rows=[...new Map([...active,...recent].map(r=>[String(r.id),r])).values()];$('#more').hidden=recent.length<limit;render();$('#synced').textContent=new Date().toLocaleTimeString('ko-KR',{timeZone:'Asia/Seoul'})+' 업데이트';message(active.length===1000?'진행 중 예약이 1,000건 이상입니다. 전체 건수는 관리자에게 확인해주세요.':'')}catch(e){if(current===version)message('새로고침 실패 · 기존 표시 내용은 최신이 아닐 수 있습니다.\n'+e.message,true)}finally{busy=false;$('#refresh').disabled=false}}
function render(){const today=dateKST(),tomorrow=dateKST(1),active=r=>!['cancelled','completed'].includes(r.status);$('#todayLabel').textContent=new Date().toLocaleDateString('ko-KR',{timeZone:'Asia/Seoul',month:'long',day:'numeric',weekday:'long'});$('#newCount').textContent=rows.filter(r=>r.status==='new').length;$('#todayCount').textContent=rows.filter(r=>r.pickup_date===today&&active(r)).length;$('#tomorrowCount').textContent=rows.filter(r=>r.pickup_date===tomorrow&&active(r)).length;const prep=rows.filter(r=>r.pickup_date===tomorrow&&r.status==='confirmed'),pending=rows.filter(r=>r.pickup_date===tomorrow&&r.status==='new').reduce((a,r)=>a+r.quantity,0);$('#prep').textContent=(prep.length?Object.keys(names).map(k=>{const n=prep.filter(r=>r.product===k).reduce((a,r)=>a+r.quantity,0);return n?names[k]+' '+n+'개':null}).filter(Boolean).join(' · '):'확정된 예약이 없습니다.')+(pending?' / 미확정 '+pending+'개 별도 확인':'');const filter=$('#filter').value,q=$('#search').value.trim().toLowerCase(),day=$('#day').value;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));const selected=rows.filter(r=>(!q||(r.customer_name+' '+r.phone).toLowerCase().includes(q)||r.phone.replace(/\D/g,'').includes(q.replace(/[^0-9]/g,''))&&/\d/.test(q))&&(!day||r.pickup_date===day)&&(filter==='all'||filter==='new'&&r.status==='new'||filter==='today'&&r.pickup_date===today&&active(r)||filter==='tomorrow'&&r.pickup_date===tomorrow&&active(r)||filter==='upcoming'&&r.pickup_date>=today&&active(r)||r.status===filter)).sort((a,b)=>(a.pickup_date+a.pickup_time).localeCompare(b.pickup_date+b.pickup_time));$('#resultCount').textContent=selected.length+'건 · '+selected.reduce((a,r)=>a+r.quantity,0)+'개';$('#list').innerHTML=selected.length?selected.map(r=>`<article class="card" data-id="${esc(r.id)}"><div class="row spread"><span class="date">${esc(r.pickup_date)} · ${esc(r.pickup_time.slice(0,5))} 픽업${r.pickup_date<today&&active(r)?' · ⚠ 지난 픽업 확인':''}</span><span class="badge ${esc(r.status)}">${esc(statuses[r.status]||r.status)}</span></div><div class="name">${esc(r.customer_name)}</div><div class="row spread"><span>${esc(names[r.product]||r.product)} <b>${r.quantity}개</b></span><b>${won(r.total_price)}</b></div><details><summary>연락처 · 메모 · 예약 처리</summary><div class="details"><p><a href="tel:${esc(r.phone.replace(/[^+0-9]/g,''))}">${esc(r.phone)}</a></p><p class="muted">고객 메모: ${esc(r.memo||'없음')}</p><form class="edit"><label>진행 상태<select name="status">${Object.entries(statuses).map(([k,v])=>`<option value="${k}" ${r.status===k?'selected':''}>${v}</option>`).join('')}</select></label><label class="check"><input type="checkbox" name="paid" ${r.paid?'checked':''}>현장 결제 확인</label><label>직원 메모<textarea name="staff_note" maxlength="2000" rows="3" placeholder="고객 연락 결과, 준비사항 등을 적어주세요.">${esc(r.staff_note)}</textarea></label><button class="primary" type="submit">변경사항 저장</button></form></div></details></article>`).join(''):'<div class="panel empty">해당하는 예약이 없습니다.</div>'}
$('#list').onsubmit=async e=>{if(!e.target.matches('.edit'))return;e.preventDefault();const form=e.target,card=form.closest('[data-id]'),r=rows.find(r=>String(r.id)===card.dataset.id);const status=form.elements.status.value,paid=form.elements.paid.checked,note=form.elements.staff_note.value; if(status==='completed'&&!paid){message('픽업 완료 전 현장 결제를 확인해주세요.',true);return}if(status==='cancelled'&&r.status!=='cancelled'&&!confirm('이 예약을 취소 처리할까요?'))return;const button=form.querySelector('button');button.disabled=true;try{const result=await api('cake_reservations?id=eq.'+encodeURIComponent(r.id)+'&updated_at=eq.'+encodeURIComponent(r.updated_at),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({status,paid,staff_note:note,updated_at:new Date().toISOString()})});if(!result?.length)throw Error('다른 직원이 변경했거나 권한이 없습니다. 새로고침 후 다시 확인해주세요.');Object.assign(r,result[0]);render();message('예약 변경사항을 저장했습니다.')}catch(e){message('저장 결과를 확인해주세요. 재시도 전 새로고침으로 반영 여부를 확인해주세요.\n'+e.message,true);button.disabled=false}};
$('#refresh').onclick=refresh;$('#more').onclick=()=>{limit+=500;refresh()};$('#filter').onchange=render;$('#search').oninput=render;$('#day').onchange=render;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{$('#filter').value=b.dataset.filter;$('#day').value='';render()});$('#reset').onclick=()=>{$('#filter').value='all';$('#day').value='';$('#search').value='';render()};
try{session=JSON.parse(sessionStorage.getItem('nutty_staff_session'));if(session)openDashboard().catch(e=>{clear();message(e.message,true)})}catch{clear()}
</script></html>
